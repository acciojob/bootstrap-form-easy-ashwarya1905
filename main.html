<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Internship Form</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
	<div class="container border rounded my-4 p-3 p-md-4">
		<h1 class="text-center my-4">Internship Form</h1>

		<form class="row g-3 needs-validation" id="intern-form" novalidate>
			<div class="col-md-4">
				<label for="first-name-input" class="form-label">First Name</label>
				<input type="text" class="form-control" id="first-name-input" required>
				<div class="invalid-feedback">First name required!</div>
			</div>

			<div class="col-md-4">
				<label for="last-name-input" class="form-label">Last Name</label>
				<input type="text" class="form-control" id="last-name-input" required>
				<div class="invalid-feedback">Last name required!</div>
			</div>

			<div class="col-md-4">
				<label for="email-input" class="form-label">Email Address</label>
				<input type="email" class="form-control" id="email-input" placeholder="xyz@abc.com" required>
				<div class="invalid-feedback">Email required!</div>
			</div>

			<div class="col-md-6">
				<label for="college-input" class="form-label">College</label>
				<input type="text" class="form-control" id="college-input" required>
				<div class="invalid-feedback">Please provide a valid college.</div>
			</div>

			<div class="col-md-3">
				<label for="graduation-year-input" class="form-label">Graduation Year</label>
				<select class="form-select" id="graduation-year-input" required>
					<option value="" selected>Choose...</option>
					<option value="2020">2020</option>
					<option value="2021">2021</option>
					<option value="2022">2022</option>
					<option value="2023">2023</option>
				</select>
				<div class="invalid-feedback">Please select a valid Graduation Year.</div>
			</div>

			<div class="col-md-3">
				<label for="roll-no-input" class="form-label">Roll No.</label>
				<input type="number" class="form-control" id="roll-no-input" min="1" required>
				<div class="invalid-feedback">Please provide a valid Roll no.</div>
			</div>

			<div class="col-12">
				<div class="form-check">
					<input class="form-check-input" type="checkbox" id="conditions-checkbox" required>
					<label class="form-check-label" for="conditions-checkbox">Agree to terms and conditions</label>
					<div class="invalid-feedback">You must agree before submitting.</div>
				</div>
			</div>

			<div class="col-12">
				<button class="btn btn-primary" type="submit">Submit form</button>
			</div>
		</form>
	</div>

	<script>
		const form = document.getElementById('intern-form');
		form.addEventListener('submit', function (event) {
			if (!form.checkValidity()) {
				event.preventDefault();
				event.stopPropagation();
			}
			form.classList.add('was-validated');
		});
	</script>
</body>
</html>
